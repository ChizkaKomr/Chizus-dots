
# GENERAL
general {
  no_fade_in = true
  grace = 0
  disable_loading_bar = false
  hide_cursor = true
  ignore_empty_input = true
  text_trim = true
}

# BACKGROUND
background {
    monitor = 
    path = ~/Pictures/wallpapers/W39/crying.png
    blur_passes = 2
    blur_size = 4
    contrast = 0.8
    brightness = 0.7
    vibrancy = 0.3
}




# TIME
label {
    monitor =
    text = $TIME
    # color = rgba(255, 255, 255, 1)
    color = rgba(199, 128, 255, 1.0)
    font_size = 150
    font_family = Train One
    position = 0, 500
    halign = center
    valign = bottom

}

# INPUT FIELD
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 3
    outer_color = rgba(199, 128, 255, 1) 
    dots_size = 0.25 
    rounding = 100
    dots_spacing = 0.35 
    dots_center = true
    font_family = Roboto Mono
    inner_color = rgba(67, 65, 76, 0.5) 
    font_color = rgba(199, 128, 255, 0.5)
    fade_on_empty = true
    placeholder_text = <b>Hiii cutieee</b>
    hide_input = false
    position = 0, -200
    halign = center
    valign = center
    zindex = 20
}

