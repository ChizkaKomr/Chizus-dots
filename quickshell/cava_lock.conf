# Dedicated cava config for the Quickshell lockscreen visualizer (raw ascii output)
[general]
bars = 40
framerate = 60

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
monstercat = 1
noise_reduction = 60
